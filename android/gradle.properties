org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# Fix: plugin tflite_flutter punya Java compiler target (1.8) yang
# tidak sinkron dengan Kotlin compiler target (17) di dalam paketnya
# sendiri. Baris ini menurunkan validasi ketidakcocokan itu dari ERROR
# jadi WARNING saja, supaya build tetap jalan (ini solusi resmi yang
# disarankan Kotlin sendiri untuk kasus ini — lihat pesan error
# "Learn more about JVM-target validation").
kotlin.jvm.target.validation.mode=warning