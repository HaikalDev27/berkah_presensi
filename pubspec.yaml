name: berkah_presensi
description: Aplikasi absensi karyawan PT. Berkah Global Business
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  intl: ^0.20.2
  http: ^1.6.0
  flutter_secure_storage: ^10.3.1
  flutter_native_splash: ^2.4.7
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter_native_splash:
  color: "#ffffff"
  image: assets/images/berkahglobal.png
  android: true
  ios: true
  web: false
  android_gravity: center
  ios_content_mode: scaleAspectFill

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/berkahglobal.png"

flutter:
  uses-material-design: true
  assets:
      - assets/images/
