name: berkah_presensi
description: Aplikasi absensi karyawan PT. Berkah Global Business
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  intl: ^0.20.2
  local_auth: ^2.3.0
  shared_preferences: ^2.5.5
  http: ^1.6.0
  image_picker: ^1.2.2
  geolocator: ^14.0.2
  flutter_dotenv: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - .env
