name: berkah_presensi
description: Aplikasi absensi karyawan PT. Berkah Global Business
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  intl: ^0.20.2
  local_auth: ^2.3.0
  shared_preferences: ^2.5.5
  http: ^1.6.0
  image_picker: ^1.2.2
  geolocator: ^14.0.2
  flutter_dotenv: ^6.0.1
  camera: ^0.11.0+2
  permission_handler: ^11.3.1
  path_provider: ^2.1.4
  google_mlkit_face_detection: ^0.13.1
  tflite_flutter: ^0.11.0
  image: ^4.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/models/
    - .env

# Konfigurasi flutter_launcher_icons — generate icon untuk semua ukuran
# otomatis dari 1 file gambar. Jalankan setelah ganti path gambar di bawah:
#   flutter pub get
#   flutter pub run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo.png"
  # Kalau logo.png background-nya transparan dan kamu mau tambah warna latar
  # solid biar icon tidak polos-transparan di launcher, aktifkan 2 baris ini:
  # adaptive_icon_background: "#3E9C76"
  # adaptive_icon_foreground: "assets/images/logo.png"
